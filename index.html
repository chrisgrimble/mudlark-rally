<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mudlark Rally</title>
<meta name="theme-color" content="#0d0a12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #0d0a12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; }
  #game {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    image-rendering: pixelated;
    background: #000;
  }
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; }
  body.touch #touch { display: block; }
  #touch button {
    position: absolute; bottom: 16px; width: 76px; height: 76px;
    pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
    border: 2px solid rgba(255,255,255,.55); border-radius: 50%;
    background: rgba(0,0,0,.3); color: #fff; font: bold 15px monospace;
  }
  #touch button.on { background: rgba(255,200,80,.55); }
  #btn-left  { left: 16px; }
  #btn-right { left: 104px; }
  #btn-boost { right: 16px; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<div id="touch">
  <button id="btn-left"  data-action="left">&#9664;</button>
  <button id="btn-right" data-action="right">&#9654;</button>
  <button id="btn-boost" data-action="boost">BOOST</button>
</div>
<script src="js/audio.js"></script>
<script src="js/track.js"></script>
<script src="js/art.js"></script>
<script src="js/main.js"></script>
</body>
</html>
